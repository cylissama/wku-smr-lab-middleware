version: "3.8"

# Pulls its values from the central .env in this directory — see .env for
# the load/deploy commands.

services:

  camera-front:
    image: camera-edge:latest

    environment:
      MQTT_BROKER_IP: ${MQTT_BROKER_IP}
      DEVICE_ID: "${CAMERA_FRONT_DEVICE_ID}"
      CAMERA_NAME: ${CAMERA_FRONT_NAME}
      CAMERA_CALIBRATION_PATH: ${CAMERA_FRONT_CALIBRATION_PATH}
      CAMERA_MARKER_LENGTH_M: "${CAMERA_MARKER_LENGTH_M}"
      CAMERA_EDGE_HEALTH_PATH: /tmp/camera-edge-health.json

    deploy:
      replicas: 1

      restart_policy:
        condition: any

      placement:
        constraints:
          - node.labels.camera == front

    volumes:
      - type: bind
        source: /run/camera-hw
        target: /run/camera-hw

      - type: bind
        source: /opt/camera-sensor-fusion/data
        target: /app/data

    healthcheck:
      test: ["CMD", "python3", "-m", "camera_edge", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3


  camera-side:
    image: camera-edge:latest

    environment:
      MQTT_BROKER_IP: ${MQTT_BROKER_IP}
      DEVICE_ID: "${CAMERA_SIDE_DEVICE_ID}"
      CAMERA_NAME: ${CAMERA_SIDE_NAME}
      CAMERA_CALIBRATION_PATH: ${CAMERA_SIDE_CALIBRATION_PATH}
      CAMERA_MARKER_LENGTH_M: "${CAMERA_MARKER_LENGTH_M}"
      CAMERA_EDGE_HEALTH_PATH: /tmp/camera-edge-health.json

    deploy:
      replicas: 1

      restart_policy:
        condition: any

      placement:
        constraints:
          - node.labels.camera == side

    volumes:
      - type: bind
        source: /run/camera-hw
        target: /run/camera-hw

      - type: bind
        source: /opt/camera-sensor-fusion/data
        target: /app/data

    healthcheck:
      test: ["CMD", "python3", "-m", "camera_edge", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
