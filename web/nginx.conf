# WebSocket upgrade header for proxied /api/ws/* connections
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Upstreams below are looked up per request (through a
  # variable) instead of once at startup, so nginx -- and the dashboard and
  # docs it serves -- starts and stays up even while fastapi-app is down.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  # Proxy API calls to FastAPI (container name: fastapi-app)
  location /api/ {
    set $fastapi           http://fastapi-app:8000;
    rewrite ^/api/(.*)$    /$1 break;
    proxy_pass             $fastapi;
    proxy_http_version     1.1;
    proxy_set_header       Upgrade            $http_upgrade;
    proxy_set_header       Connection         $connection_upgrade;
    proxy_set_header       Host               $host;
    proxy_set_header       X-Real-IP          $remote_addr;
    proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto  $scheme;
    proxy_connect_timeout  3s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_down;
  }

  # Container state and Docker logs, straight from stack-controller -- not via
  # fastapi-app, so the dashboard can still explain things when the API is
  # down. Only these two read-only routes are exposed; deploy/remove are not.
  location ~ ^/api/system/(containers|logs)$ {
    limit_except GET { deny all; }
    set $stack_controller  http://stack-controller:8080;
    rewrite ^/api/system/(.*)$ /$1 break;
    proxy_pass             $stack_controller;
    proxy_set_header       Host               $host;
    proxy_connect_timeout  3s;
    proxy_read_timeout     15s;
    add_header Cache-Control "no-store" always;
    proxy_intercept_errors on;
    error_page 502 504 = @system_down;
  }

  location @system_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"success":false,"error":"stack-controller is not reachable from the web container, so container status and logs are unavailable"}';
  }

  location @api_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"success":false,"error":"fastapi-app is not reachable from the web container (stopped, restarting or crashed)"}';
  }

  location = /info/manifest.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location /docs/ {
    try_files $uri $uri.html $uri/ /docs/index.html;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
