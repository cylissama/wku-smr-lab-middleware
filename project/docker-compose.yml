# compose file for the ActiveMiddeleware Services (AMS) stack

version: "3.9"

services:

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: AMS-mqtt-broker
    ports:
      - "${MQTT_PORT}:1883"
      - "9001:9001"
    volumes:
      - ./mqtt_conf:/mosquitto/config

  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: AMS-fastapi
    env_file:
      - .env
    environment:
      - MQTT_HOST=mqtt-broker
      - NTP_SERVER=ntp
      # IPs
      - PGHOST=${DB_HOST}
      # Database Login Info
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
      - PGDATABASE=${DB_NAME}
      # Batched Config
      - QUEUE_SIZE=${QUEUE_SIZE}
      - B_TIMEOUT=${B_TIMEOUT}
      - BATCHES=${BATCHES}
      # Ports
      - MQTT_PORT=${MQTT_PORT}
      - ROBOT_TCP_PORT=${ROBOT_TCP_PORT}
      - PGPORT=${PGPORT}
    ports:
      - "${FASTAPI_PORT}:8000"
    volumes:
      - nas_backups:/db_backups
      - logs:/fast_server/logs
    depends_on:                
      - mqtt-broker

  web:
      build:
        context: ./web
        args:
          HOST_IP: ${HOST_IP}
          FASTAPI_PORT: ${FASTAPI_PORT}
          VITE_API_URL: ${VITE_API_URL:-}
          VITE_WS_URL: ${VITE_WS_URL:-}
          VITE_AI_URL: ${VITE_AI_URL:-}
          VITE_TWINS_URL: ${VITE_TWINS_URL:-}
          VITE_ROBOT_CAMERA_URL: ${VITE_ROBOT_CAMERA_URL:-}
          VITE_DB_GUI_URL: ${VITE_DB_GUI_URL:-}
          VITE_PORTAINER_URL: ${VITE_PORTAINER_URL:-}
          ROBOT_CAMERA_URL: ${ROBOT_CAMERA_URL:-}
          DB_GUI_URL: ${DB_GUI_URL:-}
          PORTAINER_URL: ${PORTAINER_URL:-}
      container_name: AMS-dashboard-docs
      ports:
        - "${WEB_PORT}:80"
      depends_on:
        - fastapi-app

  tcp:
    build:
      context: .            
      dockerfile: tcp_server/dockerfile

    container_name: AMS-tcp-listener
    env_file:
      - .env
    environment:
      - PGHOST=${DB_HOST}
      - NTP_SERVER=ntp
      - PGPORT=5433
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
      - PGDATABASE=${DB_NAME}
      - BATCHES=${BATCHES}
      - B_TIMEOUT=${B_TIMEOUT}
      - QUEUE_SIZE=${QUEUE_SIZE}
      - ROBOT_TCP_PORT=5001
      - HOST_IP=${HOST_IP}
    ports:
      - "${ROBOT_TCP_PORT}:5001"
    volumes:
      - logs:/tcp-server/logs

  ntp:
    image: cturra/ntp:latest
    container_name: AMS-ntp
    restart: unless-stopped
    ports:
      - "${NTP_PORT}:123/udp"
    environment:
      - TZ=America/Chicago
      - NTP_SERVERS="time1.google.com,time2.google.com,time3.google.com,time4.google.com"
    cap_add:
      - SYS_NICE
      - SYS_TIME
    volumes:
      - /etc/localtime:/etc/localtime:ro

  # --- Optional local database, for replicating the stack outside the lab ---
  # The lab deployment points DB_HOST at the NAS-hosted Postgres instance, which
  # isn't reachable from a laptop or CI box. Bring these two up alongside the
  # rest of the stack with `docker compose --profile local-db up -d` and set
  # DB_HOST=postgres / DB_PORT=5432 in .env to use them instead of the NAS.
  # Note: nas_backups/logs below are still NFS-mounted to the NAS regardless of
  # this profile — for a fully NAS-free run, use docker-compose.local.yml instead.
  postgres:
    image: postgres:16-alpine
    container_name: AMS-postgres
    profiles:
      - local-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: AMS-pgadmin
    profiles:
      - local-db
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  chrony-state:
  postgres_data:
  pgadmin_data:
  nas_backups:
    driver_opts:
      type: "nfs"
      o: "addr=${DB_HOST},nolock,soft,rw"
      device: ":/volume1/docker/postgres/backups"
  logs:
    driver_opts:
      type: "nfs"
      o: "addr=${DB_HOST},nolock,soft,rw"
      device: ":/volume1/docker/postgres/logs"
