services:
  imu-106:
    image: smart-mfg-imu:latest
    user: "0:0"
    command: ["python3", "-m", "imu_edge"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == RPIIMUJ1
    volumes:
      - type: bind
        source: /run/imu-hw
        target: /run/imu-hw
      - type: bind
        source: /opt/smart-mfg-imu/data
        target: /app/data
    environment:
      DEVICE_ID: "106"
      IMU_SOCKET_PATH: /run/imu-hw/imu.sock
      IMU_SESSION_ID: imu-node-106
      IMU_SAMPLE_HZ: "100"
      IMU_REQUEST_TARE: "true"
      IMU_RESET_COUNTER: "true"
      IMU_AUTO_START_SESSION: "true"
      IMU_STOP_SESSION_ON_EXIT: "true"
      MQTT_BROKER_IP: 192.168.2.100
      MQTT_BROKER_PORT: "1883"
      MQTT_CLIENT_ID: "106"
      MQTT_TOPIC: imu/106
      IMU_CSV_PATH: /app/data/imu-106.csv
      IMU_EDGE_HEALTH_PATH: /tmp/imu-edge-health-106.json
    healthcheck:
      test: ["CMD", "python3", "-m", "imu_edge", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

