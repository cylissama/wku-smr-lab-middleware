# Whitelist of Swarm stacks this agent is allowed to deploy/remove.
# Mounted read-only into the container at /config/stacks.yml.
# Paths are inside the container: /stacks is deploy/ mounted read-only.
#
# env_file (optional) is read fresh on every deploy and layered over the
# container's environment, since `docker stack deploy` interpolates ${VAR}s
# in compose_file from its own environment.
stacks:
  # All edge nodes (IMUs + cameras) in one stack. Supersedes the old separate
  # imu/camera entries -- don't whitelist those alongside this one, they pin
  # the same services to the same nodes.
  edge:
    compose_file: /stacks/swarm-edge-nodes.yml
    env_file: /stacks/.env
    stack_name: edge
    deploy_flags: ["--resolve-image", "never"]
    # Variables a deploy request may set for that deploy only (layered over
    # env_file). fastapi-app sends IMU_PLC_TRIGGER and CAMERA_PLC_TRIGGER
    # =false when monitoring and =true for a recording session, so monitoring
    # streams right away while a session waits for the PLC's Data_Start.
    # Monitoring against a simulated PLC (the MONITOR_PLC_IP run parameter)
    # also sets the *_PLC_PATHs. The others are the dashboard's run parameters
    # (fast_server/run_params.py, which also checks their values). Any other
    # override is refused.
    env_overrides: [IMU_PLC_TRIGGER, IMU_SAMPLE_HZ, IMU_PLC_MAX_RUN_S,
                    IMU_PLC_PATH, CAMERA_PLC_TRIGGER, CAMERA_PLC_PATH,
                    CAMERA_EDGE_SAVE_FRAMES, CAMERA_EDGE_SAVE_ANNOTATED]
